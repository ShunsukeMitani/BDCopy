name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller
    
    - name: Install create-dmg
      run: brew install create-dmg

    # --- ▼▼▼【ここから修正】▼▼▼ ---
    - name: Install external tools (ffmpeg) and Prepare binaries for PyInstaller
      run: |
        # 1. brewでffmpegとffprobeのみをインストール
        brew install ffmpeg

        # 2. ffmpeg, ffprobeをbin_macosにコピー
        #    （bin_macosフォルダはローカルで作成・tsMuxeRが既に存在すると想定）
        #    （もしbin_macosが存在しない場合のために、一応作成コマンドを追加）
        mkdir -p bin_macos
        cp $(which ffmpeg) bin_macos/ffmpeg
        cp $(which ffprobe) bin_macos/ffprobe
        
        # 3. Gitで取得したtsMuxeRを含め、すべてのバイナリに実行権限を付与
        chmod +x bin_macos/*
        echo "All required binaries prepared in ./bin_macos/."

    - name: Build the .app with PyInstaller
      run: |
        # このステップは以前と同じです
        pyinstaller main.py \
          --noconsole \
          --windowed \
          --name BDCreator \
          --add-data "bin_macos/ffmpeg:." \
          --add-data "bin_macos/ffprobe:." \
          --add-data "bin_macos/tsMuxeR:."
          # --icon=YourIcon.icns

    - name: Create .dmg
      run: |
        create-dmg \
          --volname "BDCreator" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "dist/BDCreator.dmg" \
          "dist/BDCreator.app"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDCreator-macOS.dmg
        path: dist/BDCreator.dmg