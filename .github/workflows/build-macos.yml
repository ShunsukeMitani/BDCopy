name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    # Intel Mac (x86_64)互換のバイナリを生成するため、macOS 11 (Intel互換ランナー) を指定
    runs-on: macos-11

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller
    
    - name: Install create-dmg
      run: brew install create-dmg

    # --- ▼▼▼【ここから修正】▼▼▼ ---
    # ffmpeg/ffprobe は Homebrew でインストールし、tsMuxeRはGitから取得したものを使用
    - name: Install external tools (ffmpeg) and Prepare binaries for PyInstaller
      run: |
        # 1. brewでffmpegとffprobeをインストール (Intelバイナリになる)
        brew install ffmpeg

        # 2. bin_macos フォルダを作成
        #    （tsMuxeRバイナリが既にGitで取得されている前提）
        mkdir -p bin_macos
        
        # 3. ffmpeg, ffprobeをbin_macosにコピー
        cp $(which ffmpeg) bin_macos/ffmpeg
        cp $(which ffprobe) bin_macos/ffprobe
        
        # 4. Gitで取得したtsMuxeRを含め、すべてのバイナリに実行権限を付与
        #    （tsMuxeRはGit LFSを使わない場合、事前にGitにプッシュが必要です）
        chmod +x bin_macos/*
        echo "All required binaries prepared in ./bin_macos/."
    # --- ▲▲▲【修正完了】▲▲▲ ---

    - name: Build the .app with PyInstaller
      run: |
        # このステップは以前と同じですが、Intelランナー上で実行されるためIntel互換バイナリが生成されます
        pyinstaller main.py \
          --noconsole \
          --windowed \
          --name BDCreator \
          --add-data "bin_macos/ffmpeg:." \
          --add-data "bin_macos/ffprobe:." \
          --add-data "bin_macos/tsMuxeR:."
          # --icon=YourIcon.icns

    - name: Create .dmg
      run: |
        create-dmg \
          --volname "BDCreator" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "dist/BDCreator.dmg" \
          "dist/BDCreator.app"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDCreator-macOS.dmg
        path: dist/BDCreator.dmg